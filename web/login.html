<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内部业务系统</title>
<style>
  :root {
    --green: #17a673;
    --green-dark: #0e8a5f;
    --green-soft: #e6f6ee;
    --ink: #16332b;
    --muted: #7d998f;
    --line: #dcebe4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: #f2faf6;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  .topbar {
    height: 56px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    font-size: 15px;
    letter-spacing: .5px;
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(23,166,115,.14); }
  .topbar .spacer { flex: 1; }
  .topbar .sub { color: var(--muted); font-size: 13px; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    background:
      radial-gradient(700px 420px at 15% 0%, #e2f5ec 0%, transparent 60%),
      radial-gradient(600px 400px at 100% 10%, #eaf7f1 0%, transparent 55%);
    background-image:
      linear-gradient(rgba(23,166,115,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,166,115,.05) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .card {
    width: 380px;
    max-width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-top: 4px solid var(--green);
    border-radius: 10px;
    padding: 34px 34px 26px;
    box-shadow: 0 20px 50px rgba(22, 70, 55, .10);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .mark {
    width: 42px; height: 42px; border-radius: 6px;
    background: var(--green); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 700;
  }
  .brand h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: 1px; }
  .brand p { margin: 3px 0 0; font-size: 10px; color: var(--muted); letter-spacing: 2px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  input {
    width: 100%; height: 44px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 4px;
    font-size: 16px; letter-spacing: 2px; color: var(--ink);
    background: #fcfdfc; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  button {
    width: 100%; height: 44px; margin-top: 18px;
    background: var(--green); color: #fff;
    border: 0; border-radius: 4px; font-size: 15px; letter-spacing: 4px;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { background: #9dbfae; cursor: default; }
  .err { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: #c0392b; }
  footer { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="dot"></span>
    <span>内部业务系统</span>
    <span class="spacer"></span>
    <span class="sub">统一身份认证 · 内网</span>
  </div>

  <main>
    <form class="card" id="form" autocomplete="off">
      <div class="brand">
        <div class="mark">业</div>
        <div>
          <h1>内部业务系统</h1>
          <p>INTERNAL BUSINESS SYSTEM</p>
        </div>
      </div>

      <label for="pass">访问口令</label>
      <input id="pass" type="password" inputmode="numeric" placeholder="请输入访问口令" autofocus required />
      <button type="submit" id="btn">登 录</button>
      <p class="err" id="err"></p>
      <div class="hint">本系统仅限公司内网访问，请勿将地址转发至外部。</div>
      <footer>
        <span>安全策略 v2.4</span>
        <span id="clock"></span>
      </footer>
    </form>
  </main>

<script>
  const form = document.getElementById('form');
  const pass = document.getElementById('pass');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');

  const clock = document.getElementById('clock');
  const tick = () => {
    const d = new Date();
    clock.textContent = d.toLocaleDateString('zh-CN') + ' ' + d.toTimeString().slice(0, 8);
  };
  tick();
  setInterval(tick, 1000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = pass.value.trim();
    if (!value) return;
    btn.disabled = true;
    btn.textContent = '验证中…';
    err.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pass: value }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        btn.textContent = '进入系统…';
        location.href = '/';
        return;
      }
      err.textContent = data.msg || '口令不正确';
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      pass.value = '';
      pass.focus();
    } catch {
      err.textContent = '网络异常，请确认服务已启动';
    } finally {
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  });
</script>
</body>
</html>
